<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agenda | Bibliothèque Edgard Petit</title>
    <meta name="description" content="Conférences et événements de la Bibliothèque Edgard Petit." />
    <link rel="icon" href="../assets/favicon.jpg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config={theme:{extend:{colors:{institution:"#075ea8",navy:"#12324a",gold:"#f3b51b",ink:"#111827",mist:"#eef6fb"},boxShadow:{soft:"0 16px 45px rgba(18, 50, 74, 0.12)"}}}};</script>
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body class="bg-white text-ink" data-page="agenda" data-root="..">
    <a class="skip-link" href="#main" data-i18n="skip">Aller au contenu</a>
    <header class="sticky top-0 z-40 border-b border-slate-200 bg-white/95 backdrop-blur" data-site-header></header>
    <main id="main">
      <section class="section-band">
        <div class="mx-auto max-w-7xl px-4 py-16 lg:px-8">
          <div class="flex flex-col justify-between gap-4 md:flex-row md:items-end">
            <div>
              <p class="eyebrow" data-i18n="eventsKicker">Agenda</p>
              <h1 class="section-title" data-i18n="eventsTitle">Conférences et événements</h1>
              <p class="catalog-public-note mt-5">
                Connectez-vous pour accéder à tous les événements publiés.
              </p>
            </div>
          </div>
          <form id="event-filters" class="mt-8 grid gap-4 rounded-lg border border-slate-200 bg-white p-4 shadow-soft md:grid-cols-3" aria-label="Filtres des événements">
            <label class="field"><span>Recherche</span><input id="event-search" type="search" placeholder="Titre, lieu, description..." /></label>
            <label class="field"><span>Type</span><select id="event-type-filter"></select></label>
            <label class="field"><span>Tarif</span><select id="event-price-filter"><option value="">Tous</option><option value="free">Gratuit</option><option value="paid">Payant</option></select></label>
          </form>
          <div id="events-grid" class="mt-8 grid gap-5 lg:grid-cols-3"></div>
        </div>
      </section>
    </main>
    <footer class="border-t border-slate-200 bg-navy text-white" data-site-footer></footer>
    <script type="module" src="../js/app.js"></script>
  </body>
</html>
