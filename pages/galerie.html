<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Galerie | Bibliothèque Edgard Petit</title>
    <meta name="description" content="Galerie publique des photos publiées par l'administration de la Bibliothèque Edgard Petit." />
    <link rel="icon" href="../assets/favicon.jpg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config={theme:{extend:{colors:{institution:"#075ea8",navy:"#12324a",gold:"#f3b51b",ink:"#111827",mist:"#eef6fb"},boxShadow:{soft:"0 16px 45px rgba(18, 50, 74, 0.12)"}}}};</script>
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body class="bg-white text-ink" data-page="galerie" data-root="..">
    <a class="skip-link" href="#main" data-i18n="skip">Aller au contenu</a>
    <header class="sticky top-0 z-40 border-b border-slate-200 bg-white/95 backdrop-blur" data-site-header></header>
    <main id="main">
      <section class="gallery-hero">
        <div class="mx-auto max-w-7xl px-4 py-16 lg:px-8">
          <div class="gallery-hero-panel">
            <p class="eyebrow">Galerie officielle</p>
            <h1 class="section-title">Photos publiées par l'administration</h1>
            <p class="mt-5 max-w-3xl text-lg leading-8 text-slate-700">
              Retrouvez ici les images des formations, rencontres, activités éducatives et moments de vie de la Bibliothèque Edgard Petit.
            </p>
          </div>
        </div>
      </section>

      <section class="mx-auto max-w-7xl px-4 py-16 lg:px-8">
        <form id="gallery-filters" class="mb-8 grid gap-4 rounded-lg border border-slate-200 bg-white p-4 shadow-soft md:grid-cols-3" aria-label="Filtres de la galerie">
          <label class="field md:col-span-2"><span>Recherche</span><input id="gallery-search" type="search" placeholder="Album, titre, description..." /></label>
          <label class="field"><span>Album</span><select id="gallery-album-filter"></select></label>
        </form>
        <div class="gallery-albums-head">
          <div>
            <p class="eyebrow">Albums photo</p>
            <h2>Collections publiées</h2>
          </div>
          <span id="gallery-album-count">0 album</span>
        </div>
        <div id="gallery-albums" class="gallery-albums" aria-label="Albums photo"></div>
        <div id="gallery-current-album" class="gallery-current-album hidden">
          <button class="btn-secondary" type="button" data-gallery-back>Voir tous les albums</button>
          <div>
            <p class="eyebrow">Album sélectionné</p>
            <h2 data-gallery-current-title></h2>
          </div>
          <span data-gallery-current-count></span>
        </div>
        <div id="gallery-grid" class="gallery-grid" aria-label="Galerie de photos"></div>
      </section>
    </main>
    <footer class="border-t border-slate-200 bg-navy text-white" data-site-footer></footer>
    <script type="module" src="../js/app.js"></script>
  </body>
</html>
