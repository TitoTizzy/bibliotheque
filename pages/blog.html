<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Publications | Bibliothèque Edgard Petit</title>
    <meta name="description" content="Publications scientifiques de la Bibliothèque Edgard Petit." />
    <link rel="icon" href="../assets/favicon.jpg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config={theme:{extend:{colors:{institution:"#075ea8",navy:"#12324a",gold:"#f3b51b",ink:"#111827",mist:"#eef6fb"},boxShadow:{soft:"0 16px 45px rgba(18, 50, 74, 0.12)"}}}};</script>
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body class="bg-white text-ink" data-page="blog" data-root="..">
    <a class="skip-link" href="#main" data-i18n="skip">Aller au contenu</a>
    <header class="sticky top-0 z-40 border-b border-slate-200 bg-white/95 backdrop-blur" data-site-header></header>
    <main id="main">
      <section class="mx-auto max-w-7xl px-4 py-16 lg:px-8">
        <p class="eyebrow" data-i18n="blogKicker">Publications</p>
        <h1 class="section-title" data-i18n="blogTitle">Publications</h1>
        <p class="mt-5 max-w-3xl text-slate-700">Toutes les publications sont accessibles sans connexion, avec image de couverture, galerie liée et partage direct vers WhatsApp, Twitter/X et Facebook.</p>
        <div id="blog-grid" class="mt-8 grid gap-5 lg:grid-cols-3"></div>
      </section>
    </main>
    <footer class="border-t border-slate-200 bg-navy text-white" data-site-footer></footer>
    <script type="module" src="../js/app.js"></script>
  </body>
</html>
