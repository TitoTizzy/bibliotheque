<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Publications | Administration</title>
    <link rel="icon" href="../assets/favicon.jpg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config={theme:{extend:{colors:{institution:"#075ea8",navy:"#12324a",gold:"#f3b51b",ink:"#111827",mist:"#eef6fb"},boxShadow:{soft:"0 16px 45px rgba(18, 50, 74, 0.12)"}}}};</script>
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body class="bg-white text-ink protected-page" data-page="admin" data-admin-module="blog" data-root="..">
    <a class="skip-link" href="#main">Aller au contenu</a>
    <header class="sticky top-0 z-40 border-b border-slate-200 bg-white/95 backdrop-blur" data-site-header></header>
    <main id="main" class="dashboard-shell admin-app">
      <section class="admin-command-bar"><div><p class="eyebrow">Module</p><h1>Publications</h1><!-- Note dev: module publications avec couverture obligatoire et galerie liée, 20 images maximum. --></div></section>
      <section class="admin-workspace">
        <aside class="admin-nav-panel"><div class="admin-user-chip"><span class="status-pill success">SuperAdmin</span><strong>ouhhaiti@gmail.com</strong></div><nav><a href="./index.html">Vue générale</a><a href="./capacite.html">Capacité & pointage</a><a href="./catalogue.html">Catalogue</a><a href="./evenements.html">Événements</a><a href="./blog.html" class="is-active">Publications</a><a href="./galerie.html">Galerie</a><a href="./paiements.html">Paiements</a><a href="./roles.html">Comptes & accès</a></nav></aside>
        <div class="admin-main-grid">
          <section class="admin-panel wide">
            <div class="dash-card-head"><div><p class="eyebrow">Édition</p><h2>Composer une publication</h2></div><span class="status-pill warning">Brouillon</span></div>
            <form class="dash-form editorial-form" data-preview-form="post">
              <label><span>Titre</span><input data-preview-title placeholder="Titre de la publication" /></label>
              <label><span>Catégorie</span><select data-preview-category><option>Sélectionner une catégorie</option></select></label>
              <label><span>Auteur</span><input data-preview-author placeholder="Nom de l'auteur" /></label>
              <label><span>Relecteur</span><input data-preview-auditor placeholder="Nom du relecteur" /></label>
              <label class="full"><span>Image de couverture</span><input data-preview-image type="file" accept="image/*" /></label>
              <label class="full"><span>Galerie liée</span><input type="file" accept="image/*" multiple data-max-files="20" /><small data-upload-limit-message>20 photos maximum par publication.</small></label>
              <div class="article-editor full" data-rich-editor-wrapper>
                <span>Contenu</span>
                <div class="article-toolbar" data-rich-editor-toolbar aria-label="Mise en forme de la publication">
                  <select data-editor-command="fontName" aria-label="Police">
                    <option value="Arial">Arial</option>
                    <option value="Georgia">Georgia</option>
                    <option value="Times New Roman">Times New Roman</option>
                    <option value="Verdana">Verdana</option>
                    <option value="Trebuchet MS">Trebuchet MS</option>
                  </select>
                  <select data-editor-command="fontSize" aria-label="Taille">
                    <option value="2">10</option>
                    <option value="3" selected>12</option>
                    <option value="4">14</option>
                    <option value="5">18</option>
                    <option value="6">24</option>
                    <option value="7">32</option>
                  </select>
                  <button type="button" data-editor-command="bold" aria-label="Gras" title="Gras"><svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5h5.2a3.2 3.2 0 0 1 0 6.4H8V5Z"/><path d="M8 11.4h6a3.8 3.8 0 0 1 0 7.6H8v-7.6Z"/><path d="M8 5v14"/></svg></button>
                  <button type="button" data-editor-command="italic" aria-label="Italique" title="Italique"><svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 5h8"/><path d="M6 19h8"/><path d="m14 5-4 14"/></svg></button>
                  <button type="button" data-editor-command="underline" aria-label="Souligné" title="Souligné"><svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5v6a5 5 0 0 0 10 0V5"/><path d="M5 21h14"/></svg></button>
                  <button type="button" data-editor-command="strikeThrough" aria-label="Barré" title="Barré"><svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/><path d="M8 8.5C8.7 6.5 10.5 5 13 5c2.1 0 3.8.9 4.7 2.3"/><path d="M16.5 15.2c-.8 2.2-2.6 3.8-5.1 3.8-2.1 0-4-.9-5.1-2.5"/></svg></button>
                  <button type="button" data-editor-command="subscript" aria-label="Indice" title="Indice"><svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 7 6 8"/><path d="m11 7-6 8"/><path d="M14 18h4l-3.2 3H18"/></svg></button>
                  <button type="button" data-editor-command="superscript" aria-label="Exposant" title="Exposant"><svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 6 8"/><path d="m11 12-6 8"/><path d="M14 4h4l-3.2 3H18"/></svg></button>
                  <label class="editor-color" title="Couleur du texte"><svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20h14"/><path d="m8 16 4-12 4 12"/><path d="M9.4 12h5.2"/></svg><input type="color" value="#075ea8" data-editor-command="foreColor" aria-label="Couleur du texte" /></label>
                  <label class="editor-color" title="Surlignage"><svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m4 16 8.5-8.5a2 2 0 0 1 2.8 0l1.2 1.2a2 2 0 0 1 0 2.8L8 20H4v-4Z"/><path d="m13 7 4 4"/><path d="M14 20h6"/></svg><input type="color" value="#fff2a8" data-editor-command="hiliteColor" aria-label="Surlignage" /></label>
                  <button type="button" data-editor-command="insertUnorderedList" aria-label="Liste à puces" title="Liste à puces"><svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11"/><path d="M9 12h11"/><path d="M9 18h11"/><path d="M4 6h.01"/><path d="M4 12h.01"/><path d="M4 18h.01"/></svg></button>
                  <button type="button" data-editor-command="insertOrderedList" aria-label="Liste numérotée" title="Liste numérotée"><svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6h10"/><path d="M10 12h10"/><path d="M10 18h10"/><path d="M4 6h1v4"/><path d="M4 10h2"/><path d="M4 14h2l-2 4h2"/></svg></button>
                  <button type="button" data-editor-command="outdent" aria-label="Réduire le retrait" title="Réduire le retrait"><svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16"/><path d="M12 12h8"/><path d="M4 18h16"/><path d="m8 9-3 3 3 3"/></svg></button>
                  <button type="button" data-editor-command="indent" aria-label="Augmenter le retrait" title="Augmenter le retrait"><svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16"/><path d="M12 12h8"/><path d="M4 18h16"/><path d="m5 9 3 3-3 3"/></svg></button>
                  <button type="button" data-editor-command="justifyLeft" aria-label="Aligner à gauche" title="Aligner à gauche"><svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16"/><path d="M4 10h11"/><path d="M4 14h16"/><path d="M4 18h10"/></svg></button>
                  <button type="button" data-editor-command="justifyCenter" aria-label="Centrer" title="Centrer"><svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16"/><path d="M7 10h10"/><path d="M4 14h16"/><path d="M8 18h8"/></svg></button>
                  <button type="button" data-editor-command="justifyRight" aria-label="Aligner à droite" title="Aligner à droite"><svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16"/><path d="M9 10h11"/><path d="M4 14h16"/><path d="M10 18h10"/></svg></button>
                  <button type="button" data-editor-command="justifyFull" aria-label="Justifier" title="Justifier"><svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16"/><path d="M4 10h16"/><path d="M4 14h16"/><path d="M4 18h16"/></svg></button>
                  <button type="button" data-editor-command="removeFormat" aria-label="Effacer la mise en forme" title="Effacer la mise en forme"><svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h10"/><path d="M9 5v11"/><path d="M14 19h6"/><path d="m16 15 4 4"/><path d="m20 15-4 4"/></svg></button>
                  <button class="editor-image-button" type="button" data-editor-image aria-label="Insérer une image" title="Insérer une image">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5v13a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18.5v-13Z"/><path d="m5 16 4.2-4.2a1.2 1.2 0 0 1 1.7 0L14 15l1.1-1.1a1.2 1.2 0 0 1 1.7 0L20 17"/><path d="M15 8h.01"/></svg>
                  </button>
                  <input class="sr-only" type="file" accept="image/*" data-editor-image-input />
                </div>
                <div class="rich-editor-surface" contenteditable="true" data-rich-editor data-placeholder="Rédiger la publication ici..."></div>
                <textarea class="sr-only" data-rich-editor-input data-preview-description></textarea>
              </div>
              <button class="btn-glass-secondary full" type="button" data-open-preview="post">Prévisualiser</button>
              <button class="btn-glass-primary full" type="button">Publier</button>
            </form>
          </section>
          <section class="admin-panel admin-overview-panel"><div class="responsive-table"><table><thead><tr><th>Publication</th><th>Auteur</th><th>Statut</th><th>Galerie</th></tr></thead><tbody><tr><td colspan="4">Aucune publication enregistrée.</td></tr></tbody></table></div></section>
        </div>
      </section>
    </main>
    <footer class="border-t border-slate-200 bg-navy text-white" data-site-footer></footer>
    <script type="module" src="../js/app.js"></script>
  </body>
</html>
