<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Événements | Administration</title>
    <link rel="icon" href="../assets/favicon.jpg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config={theme:{extend:{colors:{institution:"#075ea8",navy:"#12324a",gold:"#f3b51b",ink:"#111827",mist:"#eef6fb"},boxShadow:{soft:"0 16px 45px rgba(18, 50, 74, 0.12)"}}}};</script>
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body class="bg-white text-ink protected-page" data-page="admin" data-admin-module="events" data-root="..">
    <a class="skip-link" href="#main">Aller au contenu</a>
    <header class="sticky top-0 z-40 border-b border-slate-200 bg-white/95 backdrop-blur" data-site-header></header>
    <main id="main" class="dashboard-shell admin-app">
      <section class="admin-command-bar"><div><p class="eyebrow">Module</p><h1>Événements</h1><!-- Note dev: module événements avec flyer obligatoire et contrôle de visibilité. --></div></section>
      <section class="admin-workspace">
        <aside class="admin-nav-panel"><div class="admin-user-chip"><span class="status-pill success">SuperAdmin</span><strong>ouhhaiti@gmail.com</strong></div><nav><a href="./index.html">Vue générale</a><a href="./capacite.html">Capacité & pointage</a><a href="./catalogue.html">Catalogue</a><a href="./evenements.html" class="is-active">Événements</a><a href="./blog.html">Publications</a><a href="./galerie.html">Galerie</a><a href="./paiements.html">Paiements</a><a href="./roles.html">Comptes & accès</a></nav></aside>
        <div class="admin-main-grid">
          <section class="admin-panel wide">
            <div class="admin-split content-editor">
              <form class="dash-form" data-preview-form="event"><label><span>Titre</span><input data-preview-title placeholder="Titre de l'événement" /></label><label><span>Type</span><select data-preview-category><option>Sélectionner un type</option></select></label><label><span>Date</span><input data-preview-date type="date" /></label><label><span>Heure</span><input data-preview-time type="time" /></label><label><span>Capacité</span><input data-preview-capacity type="number" min="1" /></label><label><span>Prix HTG</span><input data-preview-price type="number" min="0" /></label><label><span>Statut</span><select><option>Brouillon</option><option>Publié</option><option>Archivé</option></select></label><label><span>Visibilité</span><select><option>Public</option><option>Privé</option></select></label><label class="full"><span>Flyer</span><input data-preview-image type="file" accept="image/*" /></label><label class="full"><span>Description</span><textarea data-preview-description placeholder="Description de l'événement"></textarea></label><button class="btn-glass-primary full" type="button">Enregistrer l'événement</button></form>
              <div class="admin-preview-card"><strong>Aperçu public</strong><button class="btn-glass-secondary" type="button" data-open-preview="event">Prévisualiser</button><!-- Note dev: ouvre une prévisualisation fidèle à la carte vitrine. --></div>
            </div>
          </section>
          <section class="admin-panel admin-overview-panel"><div class="responsive-table"><table><thead><tr><th>Événement</th><th>Date</th><th>Statut</th><th>Places</th><th>Public</th></tr></thead><tbody><tr><td colspan="5">Aucun événement enregistré.</td></tr></tbody></table></div></section>
        </div>
      </section>
    </main>
    <footer class="border-t border-slate-200 bg-navy text-white" data-site-footer></footer>
    <script type="module" src="../js/app.js"></script>
  </body>
</html>
