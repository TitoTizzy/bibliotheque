<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Galerie | Administration</title>
    <link rel="icon" href="../assets/favicon.jpg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config={theme:{extend:{colors:{institution:"#075ea8",navy:"#12324a",gold:"#f3b51b",ink:"#111827",mist:"#eef6fb"},boxShadow:{soft:"0 16px 45px rgba(18, 50, 74, 0.12)"}}}};</script>
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body class="bg-white text-ink protected-page" data-page="admin" data-admin-module="gallery" data-root="..">
    <a class="skip-link" href="#main">Aller au contenu</a>
    <header class="sticky top-0 z-40 border-b border-slate-200 bg-white/95 backdrop-blur" data-site-header></header>
    <main id="main" class="dashboard-shell admin-app">
      <section class="admin-command-bar"><div><p class="eyebrow">Module</p><h1>Galerie</h1><!-- Note dev: module galerie publique avec titres modifiables. --></div></section>
      <section class="admin-workspace">
        <aside class="admin-nav-panel"><div class="admin-user-chip"><span class="status-pill success">SuperAdmin</span><strong>ouhhaiti@gmail.com</strong></div><nav><a href="./index.html">Vue générale</a><a href="./capacite.html">Capacité & pointage</a><a href="./catalogue.html">Catalogue</a><a href="./evenements.html">Événements</a><a href="./blog.html">Publications</a><a href="./galerie.html" class="is-active">Galerie</a><a href="./paiements.html">Paiements</a><a href="./roles.html">Comptes & accès</a></nav></aside>
        <div class="admin-main-grid">
          <section class="admin-panel">
            <div class="dash-card-head"><div><p class="eyebrow">Publication</p><h2>Nouvelle photo</h2></div><span class="status-pill success">Publique</span></div>
            <form class="dash-form"><label><span>Titre</span><input placeholder="Titre de la photo" /></label><label><span>Album</span><select><option>Sélectionner un album</option></select></label><label class="full"><span>Photo</span><input type="file" accept="image/*" /></label><label class="full"><span>Description</span><input placeholder="Description de la photo" /></label><button class="btn-glass-primary full" type="button">Publier la photo</button></form>
          </section>
          <section class="admin-panel">
            <div class="dash-card-head"><div><p class="eyebrow">Albums</p><h2>Répartition</h2></div></div>
            <div class="admin-timeline compact"><article><strong>0</strong><span>photo publiée</span></article></div>
          </section>
          <section class="admin-panel admin-overview-panel"><div class="responsive-table"><table><thead><tr><th>Photo</th><th>Titre actuel</th><th>Album</th><th>Statut</th></tr></thead><tbody><tr><td colspan="4">Aucune photo enregistrée.</td></tr></tbody></table></div></section>
        </div>
      </section>
    </main>
    <footer class="border-t border-slate-200 bg-navy text-white" data-site-footer></footer>
    <script type="module" src="../js/app.js"></script>
  </body>
</html>
