<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nouveau mot de passe | Bibliothèque Edgard Petit</title>
    <meta name="description" content="Définir un nouveau mot de passe pour l'espace Bibliothèque Edgard Petit." />
    <link rel="icon" href="../assets/favicon.jpg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config={theme:{extend:{colors:{institution:"#075ea8",navy:"#12324a",gold:"#f3b51b",ink:"#111827",mist:"#eef6fb"},boxShadow:{soft:"0 16px 45px rgba(18, 50, 74, 0.12)"}}}};</script>
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body class="bg-white text-ink" data-page="auth" data-root="..">
    <a class="skip-link" href="#main" data-i18n="skip">Aller au contenu</a>
    <header class="sticky top-0 z-40 border-b border-slate-200 bg-white/95 backdrop-blur" data-site-header></header>

    <main id="main" class="auth-shell reset-password-shell">
      <section class="auth-hero">
        <div class="auth-copy">
          <p class="eyebrow">Sécurité du compte</p>
          <h1>Nouveau mot de passe</h1>
          <p>
            Définissez un mot de passe pour accéder à l'espace privé de la Bibliothèque Edgard Petit.
          </p>
          <div class="auth-benefits" aria-label="Sécurité">
            <span>Compte confirmé</span>
            <span>Accès privé</span>
            <span>Administration</span>
          </div>
        </div>
      </section>

      <section class="auth-panel" aria-label="Définir un nouveau mot de passe">
        <form class="auth-form" data-reset-password-form>
          <div class="auth-form-head">
            <h2>Créer le mot de passe</h2>
            <p>Choisissez un mot de passe d'au moins 8 caractères.</p>
          </div>
          <label class="field">
            <span>Nouveau mot de passe</span>
            <input data-reset-password type="password" placeholder="••••••••" autocomplete="new-password" minlength="8" required />
          </label>
          <label class="field">
            <span>Confirmer le mot de passe</span>
            <input data-reset-confirm type="password" placeholder="••••••••" autocomplete="new-password" minlength="8" required />
          </label>
          <button class="btn-glass-primary" type="submit">Enregistrer le mot de passe</button>
          <p class="auth-success hidden" data-reset-message></p>
        </form>
      </section>
    </main>

    <footer class="border-t border-slate-200 bg-navy text-white" data-site-footer></footer>
    <script type="module" src="../js/app.js"></script>
  </body>
</html>
